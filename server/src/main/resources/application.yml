spring:
  application:
    name: willcall
  datasource:
    url: ${WILLCALL_DB_URL:jdbc:postgresql://localhost:5432/willcall}
    username: ${WILLCALL_DB_USER:willcall}
    password: ${WILLCALL_DB_PASSWORD:willcall}
    hikari:
      # Sized deliberately: see docs/capacity-model.md. Pool exhaustion is a game-day scenario,
      # so the pool stays small enough that the failure mode is reachable — 3 replicas x 40 is
      # 120 connections against a PostgreSQL configured for 300, leaving room for the sweeper,
      # the relay and a psql session.
      #
      # It was 20 while the flash sale was shedding a fifth of its traffic. Raising it was not
      # the fix; removing a count(*) from the refusal path was. The size is now chosen for
      # headroom rather than to paper over a query.
      maximum-pool-size: ${WILLCALL_DB_POOL_MAX:40}
      minimum-idle: ${WILLCALL_DB_POOL_MIN:5}
      connection-timeout: ${WILLCALL_DB_POOL_TIMEOUT_MS:2000}
      pool-name: willcall-pool
      # connection-timeout bounds acquiring a connection. It says nothing about a statement that
      # is already running, and on 2026-09-20 that gap was the whole incident: an exclusive lock
      # on the seat table left requests blocked in PostgreSQL for thirty seconds, holding their
      # pool connections until nginx gave up and ejected every replica.
      #
      # lock_timeout, not statement_timeout: the reservation path waits on row locks by design and
      # a statement timeout would also cut short an honest query that is merely large.
      #
      # Two seconds, matching connection-timeout above, and the two were measured together. At five
      # seconds the game day shed correctly but the 503s took 8.3 s at p99 to come back, because a
      # request can wait out the pool timeout and then the lock timeout and then whatever queued
      # behind it - and a load-shedding response that arrives after eight seconds has shed nothing
      # a buyer still cares about. The contended path in a flash sale is SELECT ... FOR UPDATE SKIP
      # LOCKED, which never waits on a lock at all, so this bounds the exact-seat path and the
      # sweeper and leaves the hot path untouched.
      connection-init-sql: ${WILLCALL_DB_INIT_SQL:set lock_timeout = '2s'}
  data:
    redis:
      url: ${WILLCALL_REDIS_URL:redis://localhost:6379}
      timeout: 1s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      # Long-lived SSE connections are the reason: one platform thread per connection caps
      # a replica in the low thousands. Measured in load/results/.
      enabled: true
  mvc:
    async:
      request-timeout: -1

server:
  port: ${WILLCALL_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${WILLCALL_TOMCAT_MAX_THREADS:200}
    max-connections: ${WILLCALL_TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: willcall
      replica: ${WILLCALL_REPLICA_ID:local}
  tracing:
    sampling:
      probability: ${WILLCALL_TRACE_SAMPLE:0.05}
  otlp:
    tracing:
      # Spans are always produced, so traceId/spanId appear in every log line. Export is off
      # unless a collector is configured: an unreachable exporter retries in a loop and the
      # retries are the loudest thing in the log during a load test.
      export:
        enabled: ${WILLCALL_OTLP_ENABLED:false}
      endpoint: ${WILLCALL_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

willcall:
  replica-id: ${WILLCALL_REPLICA_ID:local}

  holds:
    # 0 disables the per-buyer cap. The default of 1 means one active hold group per buyer per
    # event, which is the fairness lever the waiting room relies on: without it a scripted buyer
    # holds the whole front row while deciding.
    max-active-per-user: ${WILLCALL_MAX_ACTIVE_HOLDS:1}

  checkout:
    # How far a hold is pushed out when checkout starts. Must exceed the payment timeout, or a
    # slow card loses the buyer their seats between prepare and settle.
    grace: ${WILLCALL_CHECKOUT_GRACE:PT30S}

  sweeper:
    enabled: ${WILLCALL_SWEEPER_ENABLED:true}
    interval-ms: ${WILLCALL_SWEEPER_INTERVAL_MS:250}
    batch-size: ${WILLCALL_SWEEPER_BATCH:500}

  outbox:
    enabled: ${WILLCALL_OUTBOX_ENABLED:true}
    # The relay tick is part of propagation latency, not separate from it: a change waits here
    # before the coalescer even sees it. At 100 ms the measured p50 was 145 ms, of which about
    # half was this. 25 ms costs four times as many empty polls on an idle event - each one a
    # cheap indexed query - and buys 75 ms off the median.
    interval-ms: ${WILLCALL_OUTBOX_INTERVAL_MS:25}
    batch-size: ${WILLCALL_OUTBOX_BATCH:500}
    retain: ${WILLCALL_OUTBOX_RETAIN:PT1H}

  realtime:
    # The coalescing window. Every propagation percentile this project publishes includes it, so
    # its value is recorded in each results file rather than assumed.
    coalesce-window-ms: ${WILLCALL_COALESCE_WINDOW_MS:50}
    # Per-connection outbound queue. On overflow the connection is told to resync rather than
    # being blocked or closed; see docs/realtime-protocol.md section 7.
    queue-capacity: ${WILLCALL_SSE_QUEUE:64}
    heartbeat-ms: ${WILLCALL_SSE_HEARTBEAT_MS:15000}
    # 0 means no timeout: a stream should live as long as the tab does, and Spring's default of
    # 30 s would make every client reconnect twice a minute.
    stream-timeout-ms: ${WILLCALL_SSE_TIMEOUT_MS:0}

  waitingroom:
    # Off unless an event turns it on. A queue in front of an event that never fills is friction
    # with no benefit.
    admitter-enabled: ${WILLCALL_ADMITTER_ENABLED:true}
    admitter-interval-ms: ${WILLCALL_ADMITTER_INTERVAL_MS:250}
    broadcast-enabled: ${WILLCALL_QUEUE_BROADCAST_ENABLED:true}
    broadcast-interval-ms: ${WILLCALL_QUEUE_BROADCAST_MS:2000}
    # The fallback admission rate for an event that has not had one measured. The measured value
    # per event lives in events.admission_rate_per_second, because it is a measurement of what
    # that event's reservation path survives rather than a preference.
    default-rate-per-second: ${WILLCALL_ADMISSION_RATE:200}
    burst: ${WILLCALL_ADMISSION_BURST:100}
    max-batch: ${WILLCALL_ADMISSION_MAX_BATCH:500}
    queue-ttl: ${WILLCALL_QUEUE_TTL:PT6H}
    token-validity: ${WILLCALL_ADMISSION_TOKEN_VALIDITY:PT10M}
    # Must be set before deploying; all replicas must share it, or a buyer admitted by one would
    # be refused by the next. The development default logs a warning at start-up.
    signing-key: ${WILLCALL_ADMISSION_SIGNING_KEY:}

  ratelimit:
    enabled: ${WILLCALL_RATELIMIT_ENABLED:true}
    # Per buyer, not per IP: a household behind one address is several buyers, and a determined
    # single buyer has many addresses. Neither is perfect; identity is the one the product cares
    # about.
    #
    # The defaults are generous enough that nobody clicking a seat map reaches them and tight
    # enough that a script does. They are deliberately far above what one person can do by hand
    # and far below what one process can.
    holds-per-second: ${WILLCALL_RATELIMIT_HOLDS:5}
    holds-burst: ${WILLCALL_RATELIMIT_HOLDS_BURST:10}
    orders-per-second: ${WILLCALL_RATELIMIT_ORDERS:2}
    orders-burst: ${WILLCALL_RATELIMIT_ORDERS_BURST:5}
    key-ttl: ${WILLCALL_RATELIMIT_TTL:PT10M}

  admin:
    # Off by default. The compose stack and CI turn it on so the end-to-end suite can make a
    # message genuinely go missing; the Terraform never sets it, so a deployed environment has no
    # such endpoint mapped at all.
    test-hooks-enabled: ${WILLCALL_TEST_HOOKS:false}

  idempotency:
    retention: ${WILLCALL_IDEMPOTENCY_RETENTION:PT24H}

  payment:
    # The checkout percentile budget is stated relative to this number, so it is configuration
    # rather than a constant: a result that does not say which gateway latency it assumed is not
    # a result.
    latency-ms: ${WILLCALL_PAYMENT_LATENCY_MS:50}
    jitter-ms: ${WILLCALL_PAYMENT_JITTER_MS:10}
    timeout-ms: ${WILLCALL_PAYMENT_TIMEOUT_MS:2000}
    default-behavior: ${WILLCALL_PAYMENT_BEHAVIOR:SUCCEED}

logging:
  level:
    root: INFO
    dev.willcall: ${WILLCALL_LOG_LEVEL:INFO}
    org.springframework.web: WARN
