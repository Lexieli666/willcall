# Local stack. Postgres and Redis keep their data in Docker named volumes rather than bind
# mounts: this repository is normally checked out on a Windows drive mounted into WSL, where a
# bind-mounted PGDATA is both slow and prone to permission failures.
#
#   docker compose up -d postgres redis app1            # single replica, for development
#   docker compose --profile replicas up -d --build     # three replicas behind the edge proxy
#
# The three-replica profile is the target for every load test in load/.

name: willcall

x-app-base: &app-base
  build:
    context: ./server
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: willcall/server:${WILLCALL_TAG:-local}
  environment: &app-env
    WILLCALL_DB_URL: jdbc:postgresql://postgres:5432/willcall
    WILLCALL_DB_USER: willcall
    WILLCALL_DB_PASSWORD: willcall
    WILLCALL_REDIS_URL: redis://redis:6379
    WILLCALL_DB_POOL_MAX: ${WILLCALL_DB_POOL_MAX:-20}
    WILLCALL_TRACE_SAMPLE: ${WILLCALL_TRACE_SAMPLE:-0.05}
    WILLCALL_OTLP_ENABLED: ${WILLCALL_OTLP_ENABLED:-false}
    WILLCALL_OTLP_ENDPOINT: ${WILLCALL_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-container}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  # The reference sizing in docs/capacity-model.md is 2 vCPU / 2 GB per replica. Enforcing it
  # here is what makes the local numbers comparable to the cloud shape they stand in for.
  deploy:
    resources:
      limits:
        cpus: '${WILLCALL_APP_CPUS:-2.0}'
        memory: ${WILLCALL_APP_MEM:-2g}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: willcall
      POSTGRES_USER: willcall
      POSTGRES_PASSWORD: willcall
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - max_connections=${WILLCALL_PG_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${WILLCALL_PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${WILLCALL_PG_EFFECTIVE_CACHE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - '${WILLCALL_PG_PORT:-15432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U willcall -d willcall']
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '${WILLCALL_PG_CPUS:-4.0}'
          memory: ${WILLCALL_PG_MEM:-8g}

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'no'
      - --save
      - ''
      - --maxmemory
      - ${WILLCALL_REDIS_MAXMEM:-1gb}
      - --maxmemory-policy
      - noeviction
    ports:
      - '${WILLCALL_REDIS_PORT:-16379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '${WILLCALL_REDIS_CPUS:-2.0}'
          memory: ${WILLCALL_REDIS_MEM:-2g}

  app1:
    <<: *app-base
    environment:
      <<: *app-env
      WILLCALL_REPLICA_ID: app1
    ports:
      - '${WILLCALL_APP1_PORT:-18081}:8080'

  app2:
    <<: *app-base
    profiles: ['replicas']
    environment:
      <<: *app-env
      WILLCALL_REPLICA_ID: app2
    ports:
      - '${WILLCALL_APP2_PORT:-18082}:8080'

  app3:
    <<: *app-base
    profiles: ['replicas']
    environment:
      <<: *app-env
      WILLCALL_REPLICA_ID: app3
    ports:
      - '${WILLCALL_APP3_PORT:-18083}:8080'

  edge:
    profiles: ['replicas']
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
      web-build:
        condition: service_completed_successfully
    ports:
      - '${WILLCALL_EDGE_PORT:-8080}:80'
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/edge/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - web-dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Builds the static bundle into a named volume the edge proxy serves. Running it as a
  # one-shot service keeps a Node toolchain out of the edge image.
  web-build:
    profiles: ['replicas']
    build:
      context: ./web
    image: willcall/web:${WILLCALL_TAG:-local}
    command: ['sh', '-c', 'cp -r /usr/share/nginx/html/. /out/ && echo web bundle published']
    volumes:
      - web-dist:/out
    restart: 'no'

volumes:
  pgdata:
  redisdata:
  web-dist:
