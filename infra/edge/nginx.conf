# Local stand-in for the AWS Application Load Balancer. It exists so the load tests hit three
# replicas through one hostname, the same shape as the cloud deployment.
#
# Two settings matter for Server-Sent Events and both are easy to get wrong:
#   proxy_buffering off  - without it nginx holds deltas until its buffer fills, which turns a
#                          50 ms coalescing window into seconds of apparent propagation latency.
#   proxy_read_timeout   - an idle SSE stream must not be reaped; the server sends a heartbeat
#                          comment every 15 s, so 300 s is ~20 missed heartbeats.

upstream willcallapp {
    # least_conn, not round robin: SSE connections are long-lived and wildly uneven in cost,
    # so request-count balancing would pile streams onto whichever replica restarted last.
    #
    # The name has no underscore on purpose. nginx will happily send `Host: willcall_app`
    # upstream if a location forgets to set Host, and Tomcat answers 400 because an underscore
    # is not legal in a domain name.
    least_conn;
    # max_fails=0 disables nginx's passive ejection, deliberately.
    #
    # The game day on 2026-09-20 held an exclusive lock on the seat table. All three replicas
    # slowed down together, all three crossed max_fails=3 within the same second, and nginx
    # answered `no live upstreams` - 502 with no Retry-After - to 1,227 buyers while every replica
    # was up and shedding correctly with 503. Passive ejection assumes replicas fail
    # independently; when the shared dependency is the thing that is slow, it converts degradation
    # into an outage. Liveness is the health check's job, and there is a real one on every
    # container. See docs/incidents/2026-09-20-connection-pool-exhaustion.md.
    server app1:8080 max_fails=0;
    server app2:8080 max_fails=0;
    server app3:8080 max_fails=0;
    keepalive 256;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SSE stream, matched by regex rather than by the prefix /api/events/.
    #
    # A prefix location ending in a slash makes nginx answer a request for the same path
    # *without* the slash with a 301 to the version with it. `POST /api/events` therefore
    # redirected to `/api/events/` — and the redirect dropped the port, so the client followed it
    # to the wrong place. Matching only the stream path removes the trap entirely.
    #
    # proxy_buffering must stay off here: with it on, nginx holds deltas until its buffer fills
    # and a 50 ms coalescing window measures as seconds of propagation latency.
    location ~ ^/api/events/[0-9a-fA-F-]+/stream$ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        # One line per connection rather than per frame would be harmless, but this location is
        # why logging was turned off in the first place; it stays off here and on everywhere else.
        access_log off;
    }

    location /api/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
        # 10s, not 30s. The application's own ceilings are lower than this - a 2 s pool timeout
        # and a 5 s lock timeout - so anything still running at ten seconds is not going to
        # produce an answer a buyer wants. At 30 s a batch of requests that started together
        # timed out together and took the whole upstream pool out with them.
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
        # Only retry what is safe to retry. A POST that reached the application and timed out may
        # have taken a seat; replaying it would be the oversell this project exists to prevent.
        # Idempotency keys make a client retry safe; an nginx retry is not one, because nginx
        # cannot tell "never delivered" from "delivered and slow". `error` alone, and nginx will
        # not retry a POST on it without `non_idempotent`, which is exactly the intent.
        proxy_next_upstream error;
        proxy_next_upstream_tries 1;
    }

    location = /ready {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location = /health {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location /actuator/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
