# Local stand-in for the AWS Application Load Balancer. It exists so the load tests hit three
# replicas through one hostname, the same shape as the cloud deployment.
#
# Two settings matter for Server-Sent Events and both are easy to get wrong:
#   proxy_buffering off  - without it nginx holds deltas until its buffer fills, which turns a
#                          50 ms coalescing window into seconds of apparent propagation latency.
#   proxy_read_timeout   - an idle SSE stream must not be reaped; the server sends a heartbeat
#                          comment every 15 s, so 300 s is ~20 missed heartbeats.

upstream willcallapp {
    # least_conn, not round robin: SSE connections are long-lived and wildly uneven in cost,
    # so request-count balancing would pile streams onto whichever replica restarted last.
    #
    # The name has no underscore on purpose. nginx will happily send `Host: willcall_app`
    # upstream if a location forgets to set Host, and Tomcat answers 400 because an underscore
    # is not legal in a domain name.
    least_conn;
    server app1:8080 max_fails=3 fail_timeout=5s;
    server app2:8080 max_fails=3 fail_timeout=5s;
    server app3:8080 max_fails=3 fail_timeout=5s;
    keepalive 256;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/events/ {
        # The SSE stream lives under /api/events/{id}/stream; buffering is off for the whole
        # prefix because a partially buffered snapshot is worse than none.
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
        proxy_read_timeout 30s;
        # Only retry what is safe to retry. A POST that reached the application and timed out
        # may have taken a seat; replaying it would be the oversell this project exists to
        # prevent. Idempotency keys make a client retry safe, an nginx retry is not one.
        proxy_next_upstream error timeout non_idempotent;
        proxy_next_upstream_tries 1;
    }

    location = /ready {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location = /health {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location /actuator/ {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://willcallapp;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
