# Main nginx configuration for the local edge proxy.
#
# Overridden rather than left at the image default because the defaults are sized for a normal web
# server, and this one has to hold five thousand long-lived streams open while also keeping
# upstream connections to three replicas. Every value below is here because the default would have
# been the binding constraint instead of the service.

user  nginx;
worker_processes  auto;

# Each SSE client costs two descriptors through the proxy: the client socket and the upstream
# socket. At 5,000 streams that is 10,000, plus the keepalive pool and log files. The image
# default is 1024 and would fail at roughly 500 streams, which would look like the service
# refusing connections.
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Per worker. With `auto` workers on a many-core host this is far more headroom than needed,
    # but a load test that hits this limit reports a connection error that looks like the
    # application refusing traffic, so the ceiling is set well clear of the target.
    worker_connections  16384;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # One line per request at five thousand streams is not useful and costs disk bandwidth during
    # a measurement. Errors are still logged.
    # Status counts at the edge, buffered. It was off because logging every request during the
    # 5,000-connection SSE run was measurable overhead - and with it off, 1,227 responses that
    # nginx generated itself were counted nowhere at all, because the application never saw them.
    # A 502 the application cannot count is exactly the response that needs counting somewhere.
    # The stream location turns it off again for itself.
    log_format willcall '$time_iso8601 $status $request_method $uri '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'request_time=$request_time upstream_time=$upstream_response_time';
    access_log  /dev/stdout willcall buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Long-lived streams: an idle keepalive timeout shorter than the heartbeat interval would reap
    # connections that are working correctly.
    keepalive_timeout  300s;
    keepalive_requests 10000;

    # A stream that is slow to be read must not be given up on; backpressure is the server's job,
    # not the proxy's.
    send_timeout       300s;

    include /etc/nginx/conf.d/*.conf;
}
