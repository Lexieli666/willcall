# Shared proxy headers, kept in one file and `include`d by every location.
#
# This is not tidiness: nginx's `proxy_set_header` inherits from the enclosing block ONLY when
# the inner block declares none of its own. A single `proxy_set_header Connection ""` inside a
# location silently discards the server-level `Host` header, nginx then sends
# `Host: <upstream-name>`, and Tomcat rejects the request with 400 because an upstream name
# with an underscore is not a legal domain name. That failure was observed and is the reason
# this file exists.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
